# render.yaml — Render.com deployment configuration
# This file tells Render how to deploy the backend and its database.
#
# Deploy steps:
# 1. Connect your GitHub repo to Render.com
# 2. Render detects this file and creates the services automatically
# 3. Set the SECRET_KEY environment variable in Render dashboard

services:
  - type: web
    name: darukaa-earth-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-earth-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: PYTHON_VERSION
        value: 3.11.6
databases:
  - name: darukaa-earth-db
    databaseName: darukaa
    user: darukaa
    plan: free
    # Note: PostGIS extension must be enabled manually in Render's PostgreSQL dashboard
    # Go to: Render Dashboard → PostgreSQL → Shell → run: CREATE EXTENSION postgis;
